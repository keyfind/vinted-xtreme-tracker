name: Vinted stündlich tracken

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Laufmodus
        required: true
        default: details
        type: choice
        options:
          - details
          - search
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "17 0-4,6-23 * * *"
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vinted-tracker
  cancel-in-progress: false

jobs:
  track-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Laufmodus bestimmen
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "17 5 * * *" ]]; then
            mode="details"
          else
            mode="search"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Laufmodus: $mode"

      - name: Angebote erfassen
        id: collector
        continue-on-error: true
        env:
          TRACKER_RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: npm run collect:once

      - name: Statisches Dashboard bauen
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:static

      - name: Verlauf archivieren
        env:
          TRACKER_RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store.json data/last-run.json
          if [[ "$TRACKER_RUN_MODE" == "details" ]]; then
            message="chore(data): täglicher Detailabgleich"
          else
            message="chore(data): stündliche Vinted-Suche"
          fi
          git diff --cached --quiet || git commit -m "$message"
          git push

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Dashboard hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Dashboard veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Collector-Fehler melden
        if: steps.collector.outcome == 'failure'
        run: exit 1
